name: blender

# Re-checks the findings that needed Blender to establish in the first place.
# Slow (it downloads Blender), so it runs weekly and on demand rather than on
# every push — verify.yml covers what can be checked from the text alone.
#
# What this protects, all of it measured rather than assumed:
#   - Action.fcurves was removed in 4.4+; the channelbag walk replaced it
#   - EEVEE Next removed use_gtao / use_bloom and renamed BLENDER_EEVEE_NEXT
#   - Principled BSDF socket names change between releases
#   - PHASE 5c routes on Rigify's deform-bone counts (35 and 160)
#   - a fresh Rigify rig defaults to IK, so FK controls do nothing
#   - geometry nodes need the modifier APPLIED, or the export loses everything
#   - USDZ exports natively, but convert_world_material writes a non-conforming .exr

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "SKILL.md"
      - "references/**"
      - "examples/gallery/**"
      - "tools/verify_blender.py"

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          set -euo pipefail
          sudo snap install blender --classic
          blender --version

      - name: Re-check the Blender-side findings
        run: |
          blender --background --factory-startup \
            --python tools/verify_blender.py
