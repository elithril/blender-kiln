name: blender

# Re-checks the findings that needed Blender to establish in the first place.
# Slow (it downloads Blender), so it runs weekly and on demand rather than on
# every push — verify.yml covers what can be checked from the text alone.
#
# What this protects, all of it measured rather than assumed:
#   - Action.fcurves was removed in 4.4+; the channelbag walk replaced it
#   - EEVEE Next removed use_gtao / use_bloom and renamed BLENDER_EEVEE_NEXT
#   - Principled BSDF socket names change between releases
#   - PHASE 5c routes on Rigify's deform-bone counts (35 and 160)
#   - a fresh Rigify rig defaults to IK, so FK controls do nothing
#   - geometry nodes need the modifier APPLIED, or the export loses everything
#   - USDZ exports natively, but convert_world_material writes a non-conforming .exr
#   - fidelity_check.py measures what it claims: seeded widths, views, refusals
#   - template_profile.py reads known radii back, a wire pressed against the body included
#   - print_check.py finds the seeded defects: holes, floating and inverted parts, slivers,
#     lost volume, odd STL files (no PrusaSlicer on the runner: its cases are skipped)
#   - fit_coupon.py writes the holes and pegs it says, diamond and round; review_renders.py
#     frames every view on the subject and fails on an empty one
#   - autorig.py turns a raw SkinTokens output into kiln's named rig, lids and ears included,
#     and exits 1 on one with an arm missing (no SkinTokens on the runner: a stored raw output)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "plugin/SKILL.md"
      - "plugin/references/**"
      - "examples/gallery/**"
      - "plugin/tools/verify_blender.py"
      - "plugin/tools/fidelity_check.py"
      - "plugin/tools/test_fidelity_check.py"
      - "plugin/tools/template_profile.py"
      - "plugin/tools/test_template_profile.py"
      - "plugin/tools/print_check.py"
      - "plugin/tools/test_print_check.py"
      - "plugin/tools/flatten.py"
      - "plugin/tools/test_flatten.py"
      - "plugin/tools/fit_coupon.py"
      - "plugin/tools/test_fit_coupon.py"
      - "plugin/tools/review_renders.py"
      - "plugin/tools/test_review_renders.py"
      - "plugin/tools/uv_check.py"
      - "plugin/tools/test_uv_check.py"
      - "plugin/tools/autorig.py"
      - "plugin/tools/test_autorig.py"
      - "plugin/tools/fixtures/**"

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          set -euo pipefail
          sudo snap install blender --classic
          # EEVEE renders through EGL. The runner image stopped shipping it in October
          # 2026 and every render died with "Couldn't open libEGL.so.1" (exit -6).
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1
          blender --version

      - name: Re-check the Blender-side findings
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python plugin/tools/verify_blender.py

      - name: Check the fidelity tool against seeded inputs
        run: |
          BLENDER=blender python3 plugin/tools/test_fidelity_check.py

      - name: Check the template profile against a seeded part
        run: |
          BLENDER=blender python3 plugin/tools/test_template_profile.py

      - name: Check the print check against seeded meshes
        run: |
          BLENDER=blender python3 plugin/tools/test_print_check.py

      - name: Check flattening against seeded meshes
        run: |
          BLENDER=blender python3 plugin/tools/test_flatten.py

      - name: Check the joint test print
        run: |
          BLENDER=blender python3 plugin/tools/test_fit_coupon.py

      - name: Check the headless review renders
        run: |
          BLENDER=blender python3 plugin/tools/test_review_renders.py

      - name: Check the UV check against seeded unwraps
        run: |
          BLENDER=blender python3 plugin/tools/test_uv_check.py

      - name: Check the auto-rig against a stored SkinTokens output
        run: |
          BLENDER=blender python3 plugin/tools/test_autorig.py
